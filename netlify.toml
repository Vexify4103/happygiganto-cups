[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "pnpm exec next dev --port 3001"
  targetPort = 3001
  port = 8889

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, follow"

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/me/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/danke/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/*"
  to = "https://happygiganto.de/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms/*"
  to = "https://happygiganto.de/terms"
  status = 301
  force = true
